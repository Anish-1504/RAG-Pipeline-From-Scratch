[project]
name = "project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anish Patil", email = "123080347+Anish-1504@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "python-dotenv",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
project-1 = "project_1:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
